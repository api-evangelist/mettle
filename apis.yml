apis:
- aid: mettle:mettle-open-data-product-api
  name: Mettle Open Data Product API
  description: Mettle's public, unsecured UK Open Banking Open Data (Product) API,
    exposing reference information about the business current accounts Mettle offers
    to sole traders and limited companies. Conforms to the OBIE Open Data API
    standard; no credentials required to read.
  humanURL: https://www.bankofapis.com/products/natwest-group-open-banking/products-and-locations/documentation/mettle
  baseURL: https://api.openbanking.prd-mettle.co.uk/open-banking/v2.3
