  - type: APIReference
    url: https://www.bankofapis.com/products/natwest-group-open-banking/products-and-locations/documentation/mettle
- aid: mettle:mettle-account-transaction-api
  name: Mettle Account and Transaction API
  description: OBIE Read/Write Account & Transaction Information (AIS) API for Mettle
    business current accounts, exposing accounts, balances, transactions, and related
    resources to FCA-authorised third parties. FAPI-secured with OAuth2/OIDC, mTLS,
    and PSD2 strong customer authentication.
  humanURL: https://www.bankofapis.com/products/accounts/documentation/mettle
  baseURL: https://api.openbanking.prd-mettle.co.uk/open-banking/v3.1/aisp
  tags:
