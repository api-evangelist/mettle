    url: https://www.bankofapis.com/products/accounts/documentation/mettle
  - type: APIReference
    url: https://www.bankofapis.com/products/accounts/documentation/mettle
- aid: mettle:mettle-payment-initiation-api
  name: Mettle Payment Initiation API
  description: OBIE Read/Write Payment Initiation Services (PIS) API for Mettle,
    allowing FCA-authorised third parties to initiate domestic and other payments
    from a customer's Mettle account with their consent. FAPI-secured with
    OAuth2/OIDC, mTLS, and PSD2 strong customer authentication.
  humanURL: https://www.bankofapis.com/products/payments/documentation/mettle
  baseURL: https://api.openbanking.prd-mettle.co.uk/open-banking/v3.1/pisp
  tags:
  - Payment Initiation
  - Payments
