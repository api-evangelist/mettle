  - type: APIReference
    url: https://www.bankofapis.com/products/payments/documentation/mettle
- aid: mettle:mettle-confirmation-of-funds-api
  name: Mettle Confirmation of Funds API
  description: OBIE Read/Write Confirmation of Funds (CBPII) API for Mettle, letting
    card-based payment instrument issuers confirm whether funds are available on a
    customer's Mettle account. FAPI-secured with OAuth2/OIDC, mTLS, and PSD2 strong
    customer authentication.
  humanURL: https://www.bankofapis.com/products/card-based-payments/documentation/mettle
