name: Mettle
kind: company
description: Mettle is a digital-only business bank account brand for UK sole traders,
  freelancers, and small limited companies, wholly owned by NatWest Group and
  originally built with Capco. It has no physical branches and is run on separate
  technology from the core NatWest bank, offering an app-based current account with
  a UK sort code and account number, invoicing, bookkeeping, tax tools, and a free
  FreeAgent accounting integration. As a NatWest Group brand, Mettle participates in
  UK Open Banking through NatWest Group's "Bank of APIs" developer platform,
  publishing PSD2 / OBIE-conformant APIs - a public, unsecured Open Data (Product)
  API describing its business current accounts, plus the FAPI-secured Read/Write
  family (Account & Transaction Information, Payment Initiation, and Confirmation of
  Funds). Read/Write access runs against a live production gateway
  (api.openbanking.prd-mettle.co.uk) secured with OAuth2/OIDC, mutual-TLS client
  authentication, and PSD2 strong customer authentication using OBIE/eIDAS
  certificates, onboarded via the Bank of APIs portal. Mettle is delivered under
  NatWest Group's FCA-authorised banking group and is a challenger/digital
  proposition rather than one of the CMA9 mandated brands.
